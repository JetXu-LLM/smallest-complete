name: Behavior report
description: Report overreach, under-delivery, activation, or stopping behavior
title: "[Behavior]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for providing evidence. Remove private code, secrets, credentials, customer data, and personal information before submitting.
  - type: input
    id: environment
    attributes:
      label: Model and harness
      description: Include the model, reasoning effort, Codex or ChatGPT surface, and version when known.
      placeholder: "Codex Desktop, GPT-5.6 Sol High, version ..."
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Exact request and relevant instructions
      description: Share the task and only the instruction context needed to understand the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome and scope
      description: What observable result should have completed the task, and what was outside it?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what the agent delivered, changed, omitted, or continued doing.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add a sanitized transcript, diff, test result, screenshot, or reproduction steps.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Closest failure type
      options:
        - Unauthorized scope expansion
        - Under-delivery
        - Failed to stop
        - Incorrect activation
        - Missed activation
        - Architecture reference misuse
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and information I am not authorized to publish.
          required: true
